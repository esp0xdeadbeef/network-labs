name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  flake-check:
    name: "nix flake check"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Test/nix scratch must not depend on the image's /tmp. The runner
      # exports RUNNER_TEMP for exactly this purpose; publish it to the
      # remaining steps (job-level env cannot read the runner context).
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      # Evaluate-only gate: the repository test suite below builds and runs the real artifacts, so avoid duplicating the build here.
      - name: "Check flake outputs"
        run: nix flake check --no-build -L --show-trace

  tests:
    name: "test suite"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Test/nix scratch must not depend on the image's /tmp. The runner
      # exports RUNNER_TEMP for exactly this purpose; publish it to the
      # remaining steps (job-level env cannot read the runner context).
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      # The suites shell out to rg/sops/yq, which the runner image does not ship.
      - name: "Install test dependencies"
        shell: bash
        run: |
          set -euo pipefail
          nix profile install --accept-flake-config \
            nixpkgs#ripgrep \
            nixpkgs#sops \
            nixpkgs#yq
          printf '%s\n' "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      # This suite resolves sibling repositories as ../network-* (the developer
      # layout). Check them out at exactly the revisions flake.lock pins so CI
      # matches a local checkout instead of silently missing them.
      - name: "Check out sibling repositories"
        shell: bash
        env:
          # Optional: read access to the private canonical repository. Absent by
          # default, in which case the step reports the exact consequence.
          CANONICAL_REPO_TOKEN: ${{ secrets.CANONICAL_REPO_TOKEN }}
        run: |
          set -euo pipefail
          workspace="$(dirname "$GITHUB_WORKSPACE")"

          nix eval --json --impure --expr '
            let
              l = builtins.fromJSON (builtins.readFile ./flake.lock);
              root = l.nodes.root.inputs or { };
              describe = nodeName:
                let n = l.nodes.${nodeName}.locked or { };
                in { type = n.type or ""; owner = n.owner or ""; repo = n.repo or ""; rev = n.rev or ""; };
            in builtins.mapAttrs (name: nodeName: describe nodeName) root
          ' > "$RUNNER_TEMP/inputs.json"

          jq -r 'to_entries[] | select(.value.type == "github" and .value.owner == "esp0xdeadbeef")
                 | [.key, .value.repo, .value.rev] | @tsv' "$RUNNER_TEMP/inputs.json" \
            > "$RUNNER_TEMP/siblings.tsv"

          while IFS=$'\t' read -r name repo rev; do
            echo "::group::${name} @ ${rev:0:10}"
            git init --quiet "${workspace}/${name}"
            git -C "${workspace}/${name}" remote add origin "https://github.com/esp0xdeadbeef/${repo}.git"
            git -C "${workspace}/${name}" fetch --quiet --depth 1 origin "${rev}"
            git -C "${workspace}/${name}" checkout --quiet FETCH_HEAD
            echo "::endgroup::"
          done < "$RUNNER_TEMP/siblings.tsv"

          # The canonical GAMP/SMS mirror lives in the private orchestrator
          # repository. Reading it needs a token this workflow does not get by
          # default: the job token is scoped to this repository, and the repo is
          # a best-effort clone below rather than a flake input.
          #
          # Set the CANONICAL_REPO_TOKEN repository secret to a token with read
          # access to esp0xdeadbeef/network-codex-agent. Without it, roughly 75
          # SMS entrypoints report "no canonical construction implementation
          # found" and fail: their construction cases live in that repository,
          # so they cannot run. That is a missing-input failure, not a defect in
          # this repository, and it is reported as such below rather than being
          # silently skipped.
          canonical_remote="https://github.com/esp0xdeadbeef/network-codex-agent.git"
          if [[ -n "${CANONICAL_REPO_TOKEN:-}" ]]; then
            canonical_remote="https://x-access-token:${CANONICAL_REPO_TOKEN}@github.com/esp0xdeadbeef/network-codex-agent.git"
          fi

          if git init --quiet "${workspace}/network-codex-agent" \
            && git -C "${workspace}/network-codex-agent" remote add origin "${canonical_remote}" \
            && git -C "${workspace}/network-codex-agent" fetch --quiet --depth 1 origin HEAD \
            && git -C "${workspace}/network-codex-agent" checkout --quiet FETCH_HEAD; then
            # Never leave the credential on disk for later steps.
            git -C "${workspace}/network-codex-agent" remote set-url origin "https://github.com/esp0xdeadbeef/network-codex-agent.git"
            printf 'CANONICAL_SMS_DIR=%s\n' "${workspace}/network-codex-agent/GAMP/SMS" >> "$GITHUB_ENV"
          else
            rm -rf "${workspace}/network-codex-agent"
            echo "::warning::network-codex-agent is not readable with this token. Roughly 75 SMS entrypoints will fail with 'no canonical construction implementation found' because their construction cases live in that private repository. Add a CANONICAL_REPO_TOKEN repository secret with read access to esp0xdeadbeef/network-codex-agent to run them."
          fi

      - name: "Run repository test suite"
        env:
          NETWORK_REPO_DIRECT_TEST_OK: "1"
        run: ./run-all-tests.sh
